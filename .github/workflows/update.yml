name: Refresh jobs and deploy

on:
  schedule:
    - cron: "17 5 * * *"   # daily, 05:17 UTC
  workflow_dispatch:
    inputs:
      batch:
        description: "Sponsors to probe this run"
        default: "8000"
  push:
    branches: [main]
    paths: ["site/**"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch live jobs
        env:
          DISCOVERY_BATCH: ${{ github.event.inputs.batch || '8000' }}
        run: python scripts/fetch_jobs.py
      - name: Commit data
        run: |
          git config user.name "Advith Ashok"
          git config user.email "180869546+Advith023@users.noreply.github.com"
          git add data site/data
          git diff --cached --quiet || git commit -m "Daily job refresh"
          git push

  deploy:
    needs: [refresh]
    if: always() && (needs.refresh.result == 'success' || needs.refresh.result == 'skipped')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
