name: Refresh jobs and deploy

on:
  schedule:
    - cron: "17 5 * * *"    # daily, 05:17 UTC
    - cron: "43 13 * * *"   # second daily run, 13:43 UTC (backup if GitHub skips one; also keeps jobs fresher)
  workflow_dispatch:
    inputs:
      batch:
        description: "Sponsors to probe this run"
        default: "8000"
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/**", "data/title_rules.json"]

permissions:
  contents: write
  issues: read
  pages: write
  id-token: write

jobs:
  refresh:
    if: github.event_name != 'push'
    concurrency:              # one data refresh at a time; site edits are never blocked by it
      group: refresh
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run tests
        run: |
          python -m pip install --quiet pytest
          python -m pytest -q tests
      - name: Fetch live jobs
        env:
          DISCOVERY_BATCH: ${{ github.event.inputs.batch || '8000' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SUGGESTIONS_CSV_URL: ${{ vars.SUGGESTIONS_CSV_URL }}
        run: python scripts/fetch_jobs.py
      - name: Commit data
        run: |
          git config user.name "Advith Ashok"
          git config user.email "180869546+Advith023@users.noreply.github.com"
          git add data site/data
          git diff --cached --quiet || git commit -m "Daily job refresh"
          # main may have moved while this ran (e.g. admin page edits); replay our data on top, keeping our data on conflict
          # Retry if main moved underneath us (e.g. several control centre clicks in a row)
          for i in 1 2 3 4 5; do
            git pull --rebase -X theirs origin main && git push && exit 0
            echo "Push attempt $i failed, retrying"; sleep $((i * 5 + RANDOM % 5))
          done
          exit 1

  rules:
    # A Hide in the control centre: apply it to the published jobs now, not at the next refresh
    if: github.event_name == 'push'
    concurrency:              # waits for a running refresh, so the refresh can't overwrite it
      group: refresh
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply hide rules
        run: python scripts/apply_rules.py
      - name: Commit data
        run: |
          git config user.name "Advith Ashok"
          git config user.email "180869546+Advith023@users.noreply.github.com"
          git add site/data/jobs.json
          git diff --cached --quiet || git commit -m "Apply hide rules"
          # Retry if main moved underneath us (e.g. several control centre clicks in a row)
          for i in 1 2 3 4 5; do
            git pull --rebase -X theirs origin main && git push && exit 0
            echo "Push attempt $i failed, retrying"; sleep $((i * 5 + RANDOM % 5))
          done
          exit 1

  deploy:
    needs: [refresh, rules]
    concurrency:
      group: pages
      cancel-in-progress: false
    if: always() && contains(fromJSON('["success","skipped"]'), needs.refresh.result) && contains(fromJSON('["success","skipped"]'), needs.rules.result)
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy1.outputs.page_url || steps.deploy2.outputs.page_url || steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      # GitHub Pages sometimes fails to find a just-uploaded artifact; wait and try again before giving up
      - id: deploy1
        continue-on-error: true
        uses: actions/deploy-pages@v4
      - if: steps.deploy1.outcome == 'failure'
        run: sleep 60
      - id: deploy2
        if: steps.deploy1.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@v4
      - if: steps.deploy1.outcome == 'failure' && steps.deploy2.outcome == 'failure'
        run: sleep 180
      - id: deployment
        if: steps.deploy1.outcome == 'failure' && steps.deploy2.outcome == 'failure'
        uses: actions/deploy-pages@v4
