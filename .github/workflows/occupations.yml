# Re-reads the Home Office occupation tables on demand. The daily refresh also does this.
name: Update occupation lists
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    concurrency:
      group: refresh
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Read gov.uk tables
        run: python scripts/eligibility.py
      - name: Commit
        run: |
          git config user.name "Advith Ashok"
          git config user.email "180869546+Advith023@users.noreply.github.com"
          git add data/occupations.json
          git diff --cached --quiet || git commit -m "Update occupation lists"
          git pull --rebase -X theirs && git push
